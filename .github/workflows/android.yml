name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npx cap add android
      - name: App icon from logo (fail ho to default icon chalega)
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconPath assets/logo.png --splashPath assets/logo.png
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SafeBunk-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
