<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0B0B14"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>SafeBunk</title>
<style>
@font-face{font-family:Poppins;src:url("fonts/poppins-400.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Poppins;src:url("fonts/poppins-600.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:Poppins;src:url("fonts/poppins-700.woff2") format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:Poppins;src:url("fonts/poppins-800.woff2") format("woff2");font-weight:800;font-display:swap}
:root{--bg:#0B0B14;--card:#14141F;--c2:#1D1D2B;--line:#282840;--tx:#EDEDF5;--mu:#9A9AB0;--ac:#7C3AED;--g:#22C55E;--a:#F59E0B;--r:#EF4444}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 Poppins,Inter,system-ui,-apple-system,Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 110px}
h2{font-size:20px;margin:4px 0 14px}h3{font-size:15px;margin-bottom:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.mu{color:var(--mu)}.sm{font-size:12px}.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.center{text-align:center}
.ans{text-align:center;padding:22px 16px}.ans b{font-size:22px;display:block}.ans.ok{border-color:var(--g);background:rgba(34,197,94,.08)}.ans.warn{border-color:var(--a);background:rgba(245,158,11,.08)}
.bar{height:9px;border-radius:5px;background:#0B0B14;overflow:hidden;margin:10px 0 6px}.bar i{display:block;height:100%}
.safe{color:var(--g)}.risk{color:var(--a)}.danger{color:var(--r)}i.safe{background:var(--g)}i.risk{background:var(--a)}i.danger{background:var(--r)}
.pc{font-size:24px;font-weight:800}.nm{font-size:17px;font-weight:700}
.btns{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;min-height:46px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--c2);color:var(--tx);font-size:14px;font-weight:600}
.btn:active{transform:scale(.97)}.btn.p{background:var(--ac);color:#fff;border-color:var(--ac)}.btn.at{background:rgba(34,197,94,.16);border-color:rgba(34,197,94,.4)}.btn.ms{background:rgba(239,68,68,.12);border-color:rgba(239,68,68,.35)}.btn.sq{flex:0 0 46px;padding:0}
label{display:block;font-size:12px;color:var(--mu);margin:10px 0 5px}
input{width:100%;padding:12px;font-size:15px;color:var(--tx);background:var(--c2);border:1px solid var(--line);border-radius:10px;outline:none}input:focus{border-color:var(--ac)}
select{width:100%;padding:12px;font-size:15px;color:var(--tx);background:var(--c2);border:1px solid var(--line);border-radius:10px;outline:none}select:focus{border-color:var(--ac)}
.ttt{display:inline-block;background:rgba(124,58,237,.16);border:1px solid rgba(124,58,237,.45);color:#C4B5FD;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--tx);font-size:13px}.chip.on{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:700}
.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}.dg{background:var(--g)}.dr{background:var(--r)}
nav{position:fixed;bottom:0;left:0;right:0;background:#0E0E1A;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:9px 0 11px;margin:4px 3px;border-radius:12px;background:none;border:0;color:var(--mu);font-size:11px}nav button.on{color:#C4B5FD;background:rgba(124,58,237,.20)}nav b{display:block}nav svg{width:22px;height:22px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;z-index:9}
.ov.c{align-items:center;padding:16px}.ov.c .sh{border-radius:20px}.sh{background:var(--card);width:100%;max-width:480px;margin:0 auto;border-radius:20px 20px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 18px)}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#fff;color:#111;padding:10px 16px;border-radius:999px;font-size:13px;display:none;z-index:99;max-width:90%}
</style></head><body>
<div style="max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 0;display:flex;gap:10px;align-items:center"><img src="icon-192.png" alt="SafeBunk logo" style="width:40px;height:40px;border-radius:11px"><div><b style="font-size:18px">SafeBunk</b><div class="mu sm">Attendance Planner — bunk safe hai ya nahi?</div></div></div>
<div class="wrap" id="app"></div>
<nav><button data-t="today" onclick="go('today')"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></b>Today</button><button data-t="subj" onclick="go('subj')"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg></b>Subjects</button><button data-t="tt" onclick="go('tt')"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg></b>Table</button><button data-t="plan" onclick="go('plan')"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></svg></b>Planner</button><button data-t="set" onclick="go('set')"><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3"/><path d="M14 2v4M8 10v4M16 18v4"/></svg></b>Settings</button></nav>
<div id="sheet"></div><div id="gate"></div><div id="toast"></div>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const KEY="safebunk_v2",D=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const def=()=>({target:75,round:true,semEnd:"",remind:"",subjects:[],tt:[],ttImg:""});
const fmtD=d=>d.toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});
let S=load(),tab="today",user=null,auth=null,db=null,fbOK=false,pf="",pt="";
const ADMIN_EMAIL="atharvpatel2008@gmail.com";
const APP_VERSION="2.8";

function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&Array.isArray(r.subjects))return Object.assign(def(),r)}catch(e){}return def()}
let ft;function save(){S._u=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}if(db&&user){clearTimeout(ft);ft=setTimeout(()=>db.collection("users").doc(user.uid).set({data:JSON.stringify(S),t:Date.now()}).catch(()=>{}),800)}}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const tf=()=>(S.target-(S.round?.5:0))/100;
const pct=s=>s.total?s.attended/s.total*100:0;
const need=(a,t,f)=>(!t||a/t>=f)?0:Math.ceil((f*t-a)/(1-f));
const safeN=(a,t,f)=>(!t||a/t<f)?0:Math.max(0,Math.floor(a/f-t));
const zone=p=>p>=S.target-(S.round?.5:0)?"safe":p>=S.target-10?"risk":"danger";
const opct=()=>{const A=S.subjects.reduce((x,s)=>x+s.attended,0),T=S.subjects.reduce((x,s)=>x+s.total,0);return T?A/T*100:0};
const ring=p=>{const c=2*Math.PI*26,off=c*(1-Math.max(0,Math.min(100,p))/100);return `<svg width="64" height="64" viewBox="0 0 64 64" style="display:block;margin:0 auto 6px"><circle cx="32" cy="32" r="26" stroke="#262640" stroke-width="7" fill="none"/><circle cx="32" cy="32" r="26" stroke="currentColor" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}" transform="rotate(-90 32 32)" style="transition:stroke-dashoffset .6s ease"/><text x="32" y="37" text-anchor="middle" font-size="15" font-weight="800" fill="var(--tx)">${Math.round(p)}%</text></svg>`};
function toast(m){const t=$("toast");t.textContent=m;t.style.display="block";clearTimeout(toast.x);toast.x=setTimeout(()=>t.style.display="none",2600)}
function countDays(s,from,to){if(!(s.days||[]).length||!from||!to)return 0;let n=0;const b=new Date(to+"T00:00");for(const d=new Date(from+"T00:00");d<=b;d.setDate(d.getDate()+1))if(s.days.includes(d.getDay()))n++;return n}
const last=s=>(s.log||[]).slice(-1)[0];
const marked=s=>{const e=last(s);return e&&e.d===today()?e:null};
function rem(s){if(!S.semEnd||S.semEnd<today())return null;return Math.max(0,countDays(s,today(),S.semEnd)-((s.days||[]).includes(new Date().getDay())&&marked(s)?1:0))}
function bud(s){const f=tf(),r=rem(s);if(r==null)return{r,b:safeN(s.attended,s.total,f),imp:false};const b=Math.floor(s.attended+r-f*(s.total+r)+1e-9);return{r,b,imp:b<0}}
function advice(s){const f=tf(),B=bud(s),n=need(s.attended,s.total,f);
 if(B.imp)return`<b class="danger">❌ ${S.target}% ab possible nahi:</b> baaki ${B.r} sab attend karke bhi max ${Math.floor((s.attended+B.r)/(s.total+B.r)*100)}%. College se condonation/medical ke baare me baat karo.`;
 if(B.r==null)return n?`<b class="${zone(pct(s))}">Recovery:</b> agli <b>${n}</b> classes lagatar attend karo.`:`<b class="safe">Safe:</b> abhi <b>${B.b}</b> bunk chal sakte hain.`;
 return`<b class="${B.b?"safe":"risk"}">Semester plan:</b> ${B.r} classes baaki → <b>${B.b}</b> bunk, <b>${B.r-B.b}</b> attend karni hongi.`}
function mark(i,a){const s=S.subjects[i];(s.log=s.log||[]).push({d:today(),a:a});s.total++;s.attended+=a;if(navigator.vibrate)navigator.vibrate(15);save();render()}
function undo(i){const s=S.subjects[i],e=(s.log||[]).pop();if(!e)return;s.total=Math.max(0,s.total-1);if(e.a)s.attended=Math.max(0,s.attended-1);if(navigator.vibrate)navigator.vibrate(10);save();render();toast("Undo ho gaya")}
function go(t){tab=t;render();scrollTo(0,0)}
const empty=`<div class="card center"><img src="icon-192.png" alt="SafeBunk" style="width:72px;height:72px;border-radius:18px"><p style="margin-top:10px"><b>Abhi koi subject nahi hai</b></p><p class="mu sm" style="margin-top:4px">Pehla subject add karo — phir SafeBunk batayega kab bunk safe hai 😎</p><button class="btn p" style="margin-top:12px;width:100%" onclick="sheet(-1)">+ Pehla subject add karo</button></div>`;
function vToday(){const TT=ttList(new Date().getDay());if(TT.length)return vTodayTT(TT);const wd=new Date().getDay();let h=`<h2>Aaj · ${fmtD(new Date())}</h2>`;if(!S.subjects.length)return h+empty;
 const L=S.subjects.map((s,i)=>({s,i})).filter(x=>(x.s.days||[]).includes(wd));let cls="",a,sub="";
 if(!L.length){a="😴 Aaj koi class nahi";sub="Subjects me class ke din set karo (✎)."}
 else{const p=L.filter(x=>!marked(x.s)),bl=p.filter(x=>bud(x.s).b<1);
  if(!p.length){a="✅ Aaj ka attendance mark ho gaya";cls="ok"}
  else if(!bl.length){a="✅ Haan, aaj bunk chal sakta hai";cls="ok";sub="Har baaki subject me margin hai."}
  else{a="⚠️ Aaj bunk mat karo";cls="warn";sub=bl.map(x=>esc(x.s.name)).join(", ")+" me margin nahi."}}
 h+=`<div class="card ans ${cls}"><span class="${zone(opct())}">${ring(opct())}</span><b>${a}</b><div class="mu sm" style="margin-top:6px">${sub}</div></div>`;
 return h+L.map(({s,i})=>{const m=marked(s),p=pct(s);return`<div class="card"><div class="row"><span class="nm">${esc(s.name)}</span><span class="pc ${zone(p)}">${Math.round(p)}%</span></div><p class="sm mu">${s.attended}/${s.total} · ${advice(s)}</p>`+
  (m?`<div class="btns"><div class="btn" style="text-align:center;line-height:26px">${m.a?"✓ Attend ki":"✕ Miss kiya"}</div><button class="btn sq" onclick="undo(${i})">↩</button></div>`:`<div class="btns"><button class="btn at" onclick="mark(${i},1)">✓ Attend ki</button><button class="btn ms" onclick="mark(${i},0)">✕ Bunk</button></div>`)+`</div>`}).join("")}
function vSubj(){let h=`<h2>Subjects</h2>`;if(!S.subjects.length)return h+empty;
 const A=S.subjects.reduce((x,s)=>x+s.attended,0),T=S.subjects.reduce((x,s)=>x+s.total,0),w=[...S.subjects].sort((a,b)=>pct(a)-pct(b))[0];
 h+=`<div class="card"><div class="row"><span class="mu sm">OVERALL</span><span class="pc ${zone(pct({attended:A,total:T}))}">${T?Math.round(A/T*100):0}%</span></div><p class="sm mu">Sabse weak: <b style="color:var(--tx)">${esc(w.name)}</b> (${Math.round(pct(w))}%). College aksar har subject me ${S.target}% maangta hai.</p></div>`;
 return h+S.subjects.map((s,i)=>{const p=pct(s),z=zone(p),lg=(s.log||[]).slice(-10);return`<div class="card"><div class="row"><span class="nm">${esc(s.name)}</span><span class="pc ${z}">${Math.round(p)}%</span></div><div class="bar"><i class="${z}" style="width:${Math.min(100,p)}%"></i></div><div class="sm mu">${s.attended}/${s.total} · ${(s.days||[]).map(d=>D[d]).join(" ")||"din set nahi"}</div><p style="margin:8px 0" class="sm">${advice(s)}</p><div class="dots">${lg.map(e=>`<i title="${e.d}" class="${e.a?"dg":"dr"}"></i>`).join("")}</div><div class="btns"><button class="btn" onclick="sheet(${i})">✎ Edit</button><button class="btn" onclick="undo(${i})">↩ Undo</button><button class="btn sq" onclick="del(${i})">🗑</button></div></div>`}).join("")+`<button class="btn p" style="width:100%" onclick="sheet(-1)">+ Subject add karo</button>`}
function vPlan(){let h=`<h2>Leave Planner</h2><div class="card"><p class="sm mu">Chhutti ki dates chuno. Timetable (class ke din) se auto calculate hoga.</p><div class="g2"><div><label>Se</label><input type="date" value="${pf}" onchange="pf=this.value;render()"></div><div><label>Tak</label><input type="date" value="${pt}" onchange="pt=this.value;render()"></div></div></div>`;
 if(!pf||!pt||pt<pf)return h;const f=tf();
 return h+S.subjects.map(s=>{const m=countDays(s,pf,pt),np=s.attended/(s.total+m)*100||0,B=bud(s),nb=B.r==null?null:B.b-m;
  return`<div class="card"><div class="row"><span class="nm">${esc(s.name)}</span><b class="${zone(np)}">${Math.round(np)}%</b></div><p class="sm mu">${m?`~${m} classes miss`:"is range me class nahi"}${nb==null?(need(s.attended,s.total+m,f)?` · wapas aane ke liye ${need(s.attended,s.total+m,f)} lagatar attend`:" · phir bhi safe"):(nb<0?` · <b class="danger">${S.target}% semester-end tak miss ho jayega</b>`:` · semester ke liye ${nb} bunk bachenge`)}</p></div>`}).join("")}
function vSet(){const fb=!fbOK?`<p class="sm mu">Abhi guest mode chal raha hai — data sirf is device me save hota hai. Login wala feature jald chalu hoga.</p>`:user?`<p class="sm">Logged in: <b>${esc(user.email)}</b></p><button class="btn" style="width:100%;margin-top:8px" onclick="auth.signOut()">Logout</button>`:`<label>Email</label><input id="aE" type="email" autocomplete="email"><label>Password (6+)</label><input id="aP" type="password" autocomplete="current-password"><div class="btns"><button class="btn p" onclick="authGo(0)">Login</button><button class="btn" onclick="authGo(1)">Sign up</button></div>`;
 return`<h2>Settings</h2><div class="card"><h3>👤 Account (sync)</h3>${fb}<p class="sm mu" style="margin-top:8px">Login karne par tumhara email aur login ka time sync ke liye save hota hai. Password kabhi kisi ko nahi dikhta — Firebase use secure rakhta hai.</p></div>
<div class="card"><h3>🎯 Target</h3><div class="chips">${[60,65,70,75,80].map(t=>`<button class="chip ${t==S.target?"on":""}" onclick="S.target=${t};save();render()">${t}%</button>`).join("")}</div><label><input type="checkbox" style="width:auto" ${S.round?"checked":""} onchange="S.round=this.checked;save();render()"> 74.5% ko 75% maano (rounding)</label><label>Semester end date</label><input type="date" value="${S.semEnd}" onchange="S.semEnd=this.value;save();render()"></div>
<div class="card"><h3>🔔 Daily reminder</h3><input type="time" value="${S.remind}" onchange="setRemind(this.value)"><p class="sm mu" style="margin-top:6px">Roz is time pe "attendance mark karo" notification aayega.</p></div>
<div class="card"><h3>💾 Backup</h3><div class="btns"><button class="btn" onclick="exp()">Copy data</button><button class="btn" onclick="imp()">Paste data</button></div><button class="btn ms" style="width:100%;margin-top:8px" onclick="if(confirm('Sab data delete?')){S=def();save();render()}">Reset sab</button></div>
<div class="card"><h3>🔄 App update</h3><p class="sm mu">Tumhara version: <b style="color:var(--tx)">v${APP_VERSION}</b>. Naya version aane par app khulte hi update ka popup apne aap aa jata hai.</p><button class="btn" style="width:100%;margin-top:8px" onclick="checkUpdate(true)">Update check karo</button></div>
<div class="card"><h3>📤 App share karo</h3><p class="sm mu">Doston ko bhejo — attendance ka tension khatam.</p><button class="btn p" style="width:100%;margin-top:8px" onclick="shareApp()">Share SafeBunk</button></div>
${user&&user.email===ADMIN_EMAIL?`<div class="card"><h3>👑 Admin — users</h3><div id="adminOut"><p class="sm mu">Kaun-kaun app use kar raha hai, kab login kiya — sab yahan dikhega.</p></div><div class="btns"><button class="btn" onclick="adminLoad()">Users load karo</button><button class="btn" onclick="adminExcel()">⬇ Excel download</button></div></div>`:""}
<p class="sm mu">SafeBunk v${APP_VERSION} · sirf planning ke liye, college ke rules final hain.</p>`}

/* ===== Timetable (v2.2): upload photo/CSV, ya manually bharo — app samjhega aaj ki classes, time aur duration ===== */
let TTD=[];
const t2m=t=>{if(!t)return 0;const[a,b]=t.split(":").map(Number);return a*60+(b||0)};
const durTxt=m=>m<=0?"":m<60?m+" min":Math.floor(m/60)+"h"+(m%60?" "+(m%60)+"m":"");
const ttList=d=>(S.tt||[]).map((e,i)=>({e,i})).filter(x=>x.e.d===d).sort((a,b)=>(a.e.s||"").localeCompare(b.e.s||""));
function ensureSubj(name,day){let i=S.subjects.findIndex(s=>s.name.toLowerCase()===name.toLowerCase());if(i<0){S.subjects.push({name,attended:0,total:0,days:[],log:[]});i=S.subjects.length-1}const s=S.subjects[i];s.days=s.days||[];if(day!=null&&!s.days.includes(day))s.days.push(day);return i}
function vTodayTT(TT){const wd=new Date().getDay();let h=`<h2>Aaj · ${fmtD(new Date())}</h2>`;
 const tot=TT.reduce((x,{e})=>x+Math.max(0,t2m(e.en)-t2m(e.s)),0);
 const L=TT.map(({e,i})=>({e,i,si:S.subjects.findIndex(s=>s.name.toLowerCase()===e.subj.toLowerCase())})).filter(x=>x.si>=0);
 const p=L.filter(x=>!marked(S.subjects[x.si])),bl=p.filter(x=>bud(S.subjects[x.si]).b<1);let a,sub="",cls="";
 if(!p.length){a="✅ Aaj ka attendance mark ho gaya";cls="ok"}
 else if(!bl.length){a="✅ Haan, aaj bunk chal sakta hai";cls="ok";sub="Har baaki class me margin hai."}
 else{a="⚠️ Aaj bunk mat karo";cls="warn";sub=bl.map(x=>esc(S.subjects[x.si].name)).join(", ")+" me margin nahi."}
 h+=`<div class="card ans ${cls}"><span class="${zone(opct())}">${ring(opct())}</span><b>${a}</b><div class="mu sm" style="margin-top:6px">${sub}</div><div style="margin-top:8px"><span class="ttt">🗓️ Aaj ${TT.length} classes · kul ${durTxt(tot)}</span></div></div>`;

function findDay(txt){const m=txt.toLowerCase().match(/sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues|tue|wed|thurs|thur|thu|fri|sat/);return m?DAYMAP[m[0]]:null}
function findTimes(txt){const out=[];const re=/(\d{1,2})[:.](\d{2})\s*(am|pm)?/gi;let m;while((m=re.exec(txt))&&out.length<4)out.push(normT(m[1],m[2],m[3]));return out}

function ttCsvUp(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const dr=[];for(const line of String(r.result).split(/\n+/)){const c=line.split(",").map(x=>x.trim());if(c.length<4)continue;const d=findDay(c[0]);if(d==null)continue;const ts=[...c.slice(2,4)].map(t=>{const m=t.match(/(\d{1,2})[:.](\d{2})\s*(am|pm)?/i);return m?normT(m[1],m[2],m[3]):""});if(!c[1]||!ts[0]||!ts[1]||t2m(ts[1])<=t2m(ts[0]))continue;dr.push({d,subj:c[1],s:ts[0],en:ts[1],room:c[4]||""})}
